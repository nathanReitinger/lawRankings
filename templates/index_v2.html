        padding: 15px; /* Padding inside the left pane */
        box-sizing: border-box; /* Ensure padding is inside the width */
    }
    /* Right pane (takes up the remaining space) */
    .right-pane {
        width: 75%;
        padding: 15px; /* Padding inside the right pane */
        box-sizing: border-box; /* Ensure padding is inside the width */
    }


    .font-garamond {
      font-family: 'EB Garamond', serif;
    }
    .font-crimson {
      font-family: 'Crimson Text', serif;
    }
    .boxed-title {
      border: 1px solid black;
      padding: 0.5rem 1rem;
      display: inline-block;
      letter-spacing: 0.25rem;
      font-size: 1.5rem;
    }

    .table-container {
        display: block;
        width: 100%; /* Full width of the container */
        margin: 5px auto;
        padding: 3px;
        max-height: 80vh; /* Full screen height for large screens */
        overflow-y: auto; /* Enable vertical scrolling if content exceeds the container's height */
        backdrop-filter: blur(2px); /* Frosted glass effect */
        border-radius: 15px; /* Rounded corners */
        border: 2px solid rgba(0, 0, 0, 0.2); /* Light border for subtle separation */
        box-sizing: border-box; /* Ensure padding and border are included in the height calculation */
    }

    /* Make adjustments for smaller screens */
    @media (max-width: 1000px) {
        .table-container {
            max-height: 60vh; /* Reduce height on smaller screens to fit the content */
            padding: 5px; /* Adjust padding for smaller screens */
        }

        /* Optionally, reduce font size for better readability */
        .table-container table {
            font-size: 14px; /* Smaller font size for mobile/tablet screens */
        }
    }

    /* Ensure there's a border at the bottom even when content is cut off */
    .table-container::-webkit-scrollbar {
        width: 8px;
    }

    .table-container::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 5px;
    }

    /* For any screen size, the bottom border is always visible */
    .table-container::after {
        content: '';
        display: block;
        height: 2px;
        background-color: rgba(0, 0, 0, 0.2);
        margin-top: 5px;
    }

    /* Customized School Table Styling */
    .school-table {
        /* width: 100%;  */
        border-collapse: collapse;
        background-color: transparent; /* Transparent background */
        color: #333; /* Dark text for better readability */
        font-family: 'Crimson Text', serif; /* Use Old Style 7 Std font */
        table-layout: auto; /* Let columns size based on content */
    }

    /* Reduced padding for rows */
    .school-table th, .school-table td {
        padding: 6px 10px; /* Reduced vertical padding to bring rows closer together */
        text-align: left;
        font-size: 16px;

    /* .school-table tr:nth-child(odd) { */

    .school-table th:first-child,
    .school-table td:first-child {
        text-align: right;
    }​

    /* Hover effect to highlight row */
    .school-table tr:hover {
        background-color: rgba(255, 255, 255, 0.9); /* Light highlight on hover */
    }

    .school-table td, .school-table th {
        border-bottom: 1px solid rgba(255, 255, 255, 0.2); /* Subtle bottom border between rows */

    /* Responsive Table */

        z-index: 1050;

                // v2 a drop-down arrow accordian 
                document.addEventListener('DOMContentLoaded', function() {
                const schoolRows = document.querySelectorAll('#school-table table tbody tr');

                schoolRows.forEach(row => {
                    const schoolCell = row.querySelector('td:nth-child(2)'); // 2nd column is School
                    const schoolName = schoolCell.textContent.trim();

                    // Insert an arrow span
                    const arrow = document.createElement('span');
                    arrow.classList.add('arrow');
                    arrow.innerHTML = ' &#9654;'; // Right-pointing arrow ▶️
                    arrow.style.cursor = 'pointer';
                    arrow.style.marginRight = '8px';
                    
                    schoolCell.prepend(arrow);

                    // Save the school name as a data attribute
                    row.setAttribute('data-school', schoolName);

                    // Click event to toggle accordion
                    row.addEventListener('click', function() {
                        const facultyRow = this.nextElementSibling;
                        const isOpen = facultyRow && facultyRow.style.display === 'table-row';

                        // Close any open accordion row first
                        if (facultyRow && isOpen) {
                            facultyRow.style.display = 'none';
                            arrow.innerHTML = '&#9654;'; // Change to right arrow ▶️
                            arrow.classList.remove('open'); // Remove rotation
                        } else {
                            // Create and insert accordion if not already present
                            if (!facultyRow || !facultyRow.classList.contains('faculty-accordion')) {
                                const newRow = document.createElement('tr');
                                newRow.classList.add('faculty-accordion');
                                newRow.innerHTML = `<td colspan="100%"><div class="faculty-content"></div></td>`;
                                this.parentNode.insertBefore(newRow, this.nextSibling);
                            }

                            const newFacultyRow = this.nextElementSibling;
                            loadFacultyData(this, newFacultyRow);
                            newFacultyRow.style.display = 'table-row';
                            arrow.innerHTML = '&#9660;'; // Change to down arrow 🔽
                            arrow.classList.add('open'); // Apply rotation
                        }
                    });
                });

                function loadFacultyData(row, accordionRow) {
                    const schoolName = row.getAttribute('data-school');
                    const facultyTableContent = document.getElementById('faculty-table-content').innerHTML;
                    const facultyRows = facultyTableContent.split('<tr>');

                    let filteredFaculty = '';

                    facultyRows.forEach(facultyRowHtml => {
                        // console.log(facultyRowHtml)
                        // console.log(schoolName)
                        facultyRowHtml = facultyRowHtml.replace(/&amp;/g, "&");
                        if (facultyRowHtml.includes(schoolName)) {
                            filteredFaculty += `<tr>${facultyRowHtml}`;
                        }
                    });

                    const facultyContentDiv = accordionRow.querySelector('.faculty-content');

                    if (filteredFaculty.trim() === '') {
                        facultyContentDiv.innerHTML = `<em>No faculty listed for ${schoolName}</em>`;
                    } else {
                        let facultyTable = '<table class="table table-bordered table-hover">';
                        facultyTable += '<thead><tr><th>Faculty Member</th><th>Publications</th><th>Adjusted Count</th></thead><tbody>';

                        filteredFaculty.split('</tr>').forEach(rowHtml => {
                            if (rowHtml.trim() !== '') {
                                let moddedString = '      <td>' + schoolName + '</td>';
                                let withoutFirstOption = rowHtml.replace(moddedString, "");
                                facultyTable += `<tr>${withoutFirstOption}</tr>`;
                            }
                        });

                        facultyTable += '</tbody></table>';

                        facultyContentDiv.innerHTML = facultyTable;
                    }
                }
            });

    // v2
    filterData.forEach(({ label, category }) => {
        const btn = document.createElement("button");
        btn.textContent = label;
        btn.dataset.category = category;
        btn.type = "button";
        btn.className = "px-2 py-1 rounded-md border text-sm transition-colors duration-200 text-left inline-block";

        const isSaved = selectedButtons.includes(label);

        if (isSaved) {
            btn.classList.add("bg-green-200", "text-green-900", "border-green-300", "shadow-md");
        } else {
            btn.classList.add("bg-gray-100", "text-gray-700", "hover:bg-gray-200");
        }

        btn.addEventListener("click", () => {
            const isActive = btn.classList.contains("bg-green-200");

            if (category === "general") {
                document.querySelectorAll('[data-category="general"]').forEach(b => {
                    b.classList.remove("bg-green-200", "text-green-900", "border-green-300", "shadow-md");
                    b.classList.add("bg-gray-100", "text-gray-700");

                    const text = b.textContent;
                    selectedButtons = selectedButtons.filter(item => item !== text);
                });
            }

            if (!isActive) {
                btn.classList.remove("bg-gray-100", "text-gray-700");
                btn.classList.add("bg-green-200", "text-green-900", "border-green-300", "shadow-md");

                if (!selectedButtons.includes(label)) {
                    selectedButtons.push(label);
                }

                updateJournalSelection(label);
            } else {
                btn.classList.remove("bg-green-200", "text-green-900", "border-green-300", "shadow-md");
                btn.classList.add("bg-gray-100", "text-gray-700");

                selectedButtons = selectedButtons.filter(item => item !== label);
                removeJournalSelection(label);
            }

            // Save current selections to localStorage
            localStorage.setItem("selectedFilters", JSON.stringify(selectedButtons));

            showLoadingSpinner();
            filterForm.submit();
        });

        if (category === "general") {
            generalButtonsContainer.appendChild(btn);
        } else {
            filterButtonsContainer.appendChild(btn);
        }
    });

    // v2
    function updateJournalSelection(label) {
        // Clear previous
        document.querySelectorAll('input[name="journal_selection"]').forEach(input => input.remove());

        // Add all current selections
        selectedButtons.forEach(label => {
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = "journal_selection";
            input.value = label;
            document.getElementById("hiddenInputsContainer").appendChild(input);
        });
    }

    function removeJournalSelection(label) {
        selectedButtons = selectedButtons.filter(item => item !== label);
        updateJournalSelection();
    }


    function showLoadingSpinner() {
      loadingSpinner.classList.remove('hidden');
    }



  </script>


<script>
    const fromYearInput = document.getElementById('fromYear');
    const toYearInput = document.getElementById('toYear');
  

    // Load years from localStorage if they exist
    const savedFromYear = localStorage.getItem('fromYear');
    const savedToYear = localStorage.getItem('toYear');

    if (savedFromYear !== null) {
        fromYearInput.value = savedFromYear;
    }
    if (savedToYear !== null) {
        toYearInput.value = savedToYear;
    }

    // Save to localStorage whenever user changes the year
    [fromYearInput, toYearInput].forEach(input => {
    input.addEventListener('input', () => {
        localStorage.setItem('fromYear', fromYearInput.value);
        localStorage.setItem('toYear', toYearInput.value);
    });
    });


    function submitOnChange() {
      showLoadingSpinner();
      let selectedButtons = JSON.parse(localStorage.getItem("selectedFilters") || "[]");
      updateJournalSelection();
      filterForm.submit();
    }
  
    fromYearInput.addEventListener('change', submitOnChange);
    toYearInput.addEventListener('change', submitOnChange);
  </script>
